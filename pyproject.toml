[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optifarm"
version = "0.1.0"
description = "Optimal Minecraft farm layouts via exact CP-SAT optimisation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["ortools>=9.8"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["mcfarm_opt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
